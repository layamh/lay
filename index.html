<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>人格测试合集</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #222;
      --text-secondary: #666;
      --primary: #4f6ef7;
      --primary-light: #eef1ff;
      --danger: #e85d75;
      --success: #34c759;
      --radius: 24px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --card: #1c1c1e;
        --text: #f1f1f1;
        --text-secondary: #a8a8a8;
        --primary: #7b93ff;
        --primary-light: #252940;
      }
    }
    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .app-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 100%;
      overflow: hidden;
    }
    .header {
      padding: 24px 24px 8px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .header p {
      color: var(--text-secondary);
      font-size: 15px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      padding: 12px 24px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar {
      display: none;
    }
    .tab {
      white-space: nowrap;
      padding: 12px 20px;
      border-radius: 999px;
      background-color: var(--card);
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab.active {
      background-color: var(--primary);
      color: white;
    }
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 0 24px 24px;
    }
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }
    .progress-wrap {
      margin: 16px 0;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .progress-bar {
      width: 100%;
      height: 12px;
      background-color: var(--card);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #6b84ff);
      width: 0%;
      border-radius: inherit;
      transition: width 0.4s ease;
    }
    .question-card {
      background-color: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      margin-top: 16px;
    }
    .question-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .option {
      padding: 18px 22px;
      border-radius: 20px;
      background-color: var(--bg);
      border: 2px solid transparent;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .option.selected {
      border-color: var(--primary);
      background-color: var(--primary-light);
    }
    .btn-group {
      margin-top: 28px;
      display: flex;
      gap: 14px;
    }
    .btn {
      flex: 1;
      padding: 18px;
      border: none;
      border-radius: 22px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn.secondary {
      background-color: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .btn.primary {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 8px 24px rgba(79, 110, 247, 0.25);
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .result-card {
      background-color: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      margin-top: 16px;
    }
    .result-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .result-desc {
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .score-item {
      margin-bottom: 20px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .score-bar-wrap {
      width: 100%;
      height: 14px;
      background-color: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .score-bar {
      height: 100%;
      border-radius: inherit;
    }
    .tip-text {
      margin-top: 24px;
      padding: 20px;
      border-radius: 20px;
      background-color: var(--primary-light);
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .reset-btn {
      margin-top: 28px;
      width: 100%;
    }
  </style>
</head>

      </section>

      <!-- 七宗罪 -->
      <section id="sin" class="screen">

          </div>
          <div class="progress-bar">

        </div>
        <div class="question-card">

          <div class="options-list" id="sin-options"></div>
          <div class="btn-group">
            <button class="btn secondary" id="sin-prev" onclick="prevQuestion('sin')">上一题</button>
            <button class="btn primary" id="sin-next" onclick="nextQuestion('sin')">下一题</button>
          </div>
        </div>
      </section>

      <!-- 七美德 -->
      <section id="virtue" class="screen">
        <div class="progress-wrap">
          <div class="progress-label">

          <div class="progress-bar">
            <div class="progress-fill" id="virtue-progress-fill"></div>
          </div>
        </div>
        <div class="question-card">
          <h2 class="question-title" id="virtue-question-text"></h2>
          <div class="options-list" id="virtue-options"></div>
          <div class="btn-group">
            <button class="btn secondary" id="virtue-prev" onclick="prevQuestion('virtue')">上一题</button>
            <button class="btn primary" id="virtue-next" onclick="nextQuestion('virtue')">下一题</button>
          </div>
        </div>
      </section>

      <!-- MBTI -->
      <section id="mbti" class="screen">
        <div class="progress-wrap">
          <div class="progress-label">
            <span>进度</span>
            <span id="mbti-progress-text">0 / 50</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="mbti-progress-fill"></div>
          </div>
        </div>
        <div class="question-card">
          <h2 class="question-title" id="mbti-question-text"></h2>
          <div class="options-list" id="mbti-options"></div>
          <div class="btn-group">
            <button class="btn secondary" id="mbti-prev" onclick="prevQuestion('mbti')">上一题</button>
            <button class="btn primary" id="mbti-next" onclick="nextQuestion('mbti')">下一题</button>
          </div>
        </div>
      </section>

      <!-- 结果页：七宗罪 -->
      <section id="result-sin" class="screen">
        <div class="result-card">
          <h2 class="result-title">你的七宗罪画像</h2>
          <p class="result-desc">下面是你在七种倾向上的得分（满分 100），分数越高代表该倾向越明显。</p>
          <div id="sin-result-content"></div>
        </div>
        <button class="btn primary reset-btn" onclick="resetTest('sin')">重新测试</button>
      </section>

      <!-- 结果页：七美德 -->
      <section id="result-virtue" class="screen">

          <div id="virtue-result-content"></div>
        </div>

      </section>

        </div>
        <button class="btn primary reset-btn" onclick="resetTest('mbti')">重新测试</button>
      </section>
    </div>
  </div>

      { name: "贪婪", color: "#af52de" },
      { name: "暴食", color: "#5856d6" }
    ];
    const virtueLabels = [
      { name: "谦逊", color: "#34c759" },
      { name: "仁爱", color: "#5ac8fa" },
      { name: "节制", color: "#007aff" },

      { name: "正义", color: "#30d158" }
    ];

    const mbtiTypes = {
      "INTJ": "建筑师：富有想象力、策略型思考者，善于规划长远目标。",
      "INTP": "逻辑学家：热爱思考，喜欢探索理论与可能性。",

    // ===================== 状态 =====================
    const state = {
      sin: { idx: 0, answers: [], selected: null },
      virtue: { idx: 0, answers: [], selected: null },
      mbti: { idx: 0, answers: [], selected: null }
    };

    const scaleOptions = [
      "完全不符",
      "不太符合",
      "一般",
      "比较符合",
      "完全符合"
    ];

    // ===================== Tab / 页面切换 =====================
    document.querySelectorAll(".tab").forEach(tab => {
      tab.onclick = () => {
        const target = tab.dataset.target;
        switchTab(target);
      };
    });

    function switchTab(name) {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

      if (["sin", "virtue", "mbti"].includes(name)) {
        document.getElementById(name).classList.add("active");
        document.querySelector(`.tab[data-target="${name}"]`).classList.add("active");
        renderQuestion(name);
      } else {
        document.getElementById("home").classList.add("active");
        document.querySelector(`.tab[data-target="home"]`).classList.add("active");
      }
    }

    // ===================== 渲染题目 =====================
    function renderQuestion(key) {
      const data = state[key];
      if (data.idx >= 50) {
        calcResult(key);
        document.getElementById(`result-${key}`).classList.add("active");
        return;
      }

      data.selected = null;
      const qText = document.getElementById(`${key}-question-text`);
      const optsWrap = document.getElementById(`${key}-options`);
      const progressText = document.getElementById(`${key}-progress-text`);
      const progressFill = document.getElementById(`${key}-progress-fill`);
      const prevBtn = document.getElementById(`${key}-prev`);
      const nextBtn = document.getElementById(`${key}-next`);

      progressText.textContent = `${data.idx + 1} / 50`;
      progressFill.style.width = `${((data.idx) / 50) * 100}%`;

      if (key === "mbti") {
        const q = mbtiQuestions[data.idx];
        qText.textContent = `第 ${data.idx + 1} 题`;
        optsWrap.innerHTML = "";
        addOption(optsWrap, q.a, () => pickOption(key, "A"));
        addOption(optsWrap, q.b, () => pickOption(key, "B"));
      } else {
        const list = key === "sin" ? sinQuestions : virtueQuestions;
        qText.textContent = list[data.idx];
        optsWrap.innerHTML = "";
        scaleOptions.forEach((opt, i) => {
          addOption(optsWrap, opt, () => pickOption(key, i));
        });
      }

      prevBtn.disabled = data.idx === 0;
      nextBtn.disabled = false;
    }

    function addOption(wrap, text, onClick) {
      const div = document.createElement("div");
      div.className = "option";
      div.textContent = text;
      div.onclick = onClick;
      wrap.appendChild(div);
    }

    function pickOption(key, value) {
      const data = state[key];
      data.selected = value;
      const opts = document.getElementById(`${key}-options`).children;
      for (const opt of opts) opt.classList.remove("selected");
      opts[typeof value === "number" ? value : (value === "A" ? 0 : 1)].classList.add("selected");
    }

    function nextQuestion(key) {
      const data = state[key];
      if (data.selected === null) {
        alert("请选择一个答案");
        return;
      }
      data.answers[data.idx] = data.selected;
      data.idx += 1;
      renderQuestion(key);
    }

    function prevQuestion(key) {
      const data = state[key];
      if (data.idx > 0) {
        data.idx -= 1;
        renderQuestion(key);
      }
    }

    // ===================== 计算结果 =====================
    function calcResult(key) {
      if (key === "sin") calcSinResult();
      else if (key === "virtue") calcVirtueResult();
      else calcMbtiResult();
    }

    function calcSinResult() {
      const ans = state.sin.answers;
      const groups = splitToSeven(ans);
      const scores = groups.map(g => average(g) * 25);
      renderScoreResult("sin-result-content", sinLabels, scores);
    }

    function calcVirtueResult() {
      const ans = state.virtue.answers;
